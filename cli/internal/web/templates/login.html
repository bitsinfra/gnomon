{{define "login"}}{{template "head" .}}
<h1>Sign in</h1>
<p class="mute">With your database login. The app then acts as your role: what the database lets you do is what you can do here.</p>
<form method="post" action="/login" style="display: grid; gap: 8px; max-width: 320px">
<input name="user" placeholder="role" autocomplete="username" required>
<input name="password" type="password" placeholder="password" autocomplete="current-password">
<button class="primary">Sign in</button></form>
{{template "foot" .}}{{end}}
