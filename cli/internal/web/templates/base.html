{{define "head"}}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · gnomon</title>
<style>
:root { --bg: #fbfbf9; --fg: #1d1d1b; --mute: #6b6b66; --line: #e2e1dc; --accent: #2f5d50; --ins: #e3f2e6; --del: #f8e1df; --upd: #fdf3d8; --bad: #a33a2b; }
@media (prefers-color-scheme: dark) { :root { --bg: #171716; --fg: #ecebe6; --mute: #9b9a94; --line: #2f2f2c; --accent: #8fc1b0; --ins: #1f3524; --del: #3d2220; --upd: #3a321b; --bad: #e58a7c; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 ui-sans-serif, system-ui, sans-serif; }
header { display: flex; gap: 18px; align-items: baseline; padding: 12px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header b { color: var(--accent); } header a { color: var(--fg); text-decoration: none; } header .who { margin-left: auto; color: var(--mute); }
main { padding: 16px 20px; max-width: 1200px; }
h1 { font-size: 20px; margin: 4px 0 12px; } h2 { font-size: 15px; margin: 22px 0 8px; }
table { border-collapse: collapse; width: 100%; } th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--mute); font-weight: 500; font-size: 12px; } td code, pre { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-all; }
a { color: var(--accent); } .mute { color: var(--mute); } .bad { color: var(--bad); }
.insert { background: var(--ins); } .delete { background: var(--del); } .update { background: var(--upd); }
.stale { text-decoration: line-through; color: var(--mute); }
.tag { display: inline-block; padding: 0 6px; border: 1px solid var(--line); border-radius: 9px; font-size: 11px; color: var(--mute); }
form.inline { display: inline; } input, select, textarea, button { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); }
button { cursor: pointer; } button.link { border: 0; padding: 0 4px; background: none; color: var(--mute, inherit); } button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.notice { padding: 8px 12px; border: 1px solid var(--line); border-radius: 4px; margin-bottom: 12px; }
.err { padding: 8px 12px; border: 1px solid var(--bad); color: var(--bad); border-radius: 4px; margin-bottom: 12px; white-space: pre-wrap; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
svg text { font: 11px ui-monospace, monospace; fill: var(--fg); } svg .node rect { fill: var(--bg); stroke: var(--line); } svg .changed rect { fill: var(--upd); stroke: var(--accent); } svg line { stroke: var(--mute); }
</style></head><body>
<header><b>gnomon</b>
{{if .Who}}<a href="/">Branches</a><a href="/cr">Change requests</a><a href="/log">Log</a><a href="/time">Time travel</a><a href="/graph">Graph</a><a href="/schema">Schema</a>
<span class="who">{{.Who}} · <a href="/logout">sign out</a></span>{{end}}
</header><main>
{{if .Notice}}<div class="notice">{{.Notice}}</div>{{end}}
{{if .Error}}<div class="err">{{.Error}}</div>{{end}}
{{end}}
{{define "foot"}}</main><footer class="mute" style="padding: 16px 20px">gnomon {{.Version}}</footer></body></html>{{end}}
{{define "csrf"}}<input type="hidden" name="csrf" value="{{.}}">{{end}}
