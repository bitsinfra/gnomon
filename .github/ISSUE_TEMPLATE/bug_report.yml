name: Bug report
description: Something gnomon does wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead (the full error, with its hint).
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest SQL script or steps that show it, starting from an empty database.
      render: sql
  - type: input
    id: gnomon
    attributes:
      label: gnomon version
      placeholder: "select extversion from pg_extension where extname = 'gnomon'"
    validations:
      required: true
  - type: input
    id: postgres
    attributes:
      label: PostgreSQL version and platform
      placeholder: "PostgreSQL 18.1 on Linux, self-hosted"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Install
      options:
        - SQL core (CREATE EXTENSION)
        - SQL core and the C module
        - pg_tle package
        - Plain-SQL install
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: gnomon.status() and gnomon.doctor()
      description: Their output in the session that shows the problem, if it is about a branch.
