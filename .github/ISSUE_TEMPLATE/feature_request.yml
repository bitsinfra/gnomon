name: Feature request
description: Something gnomon should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and where gnomon gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The SQL, CLI or SDK call you imagine, if you have one in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now
      description: Workarounds you use or other tools you have tried.
